chunking:
  code:
    include_class_context: true
    include_docstrings: true
    max_chunk_size: 1024
    strategy: ast_functional
  discussion:
    include_metadata: true
    strategy: paired
  docs:
    chunk_overlap: 50
    chunk_size: 512
    separators:
    - '

      ## '
    - '

      ### '
    - '

      --- '
    - '

      .. code::'
    - '


      '
    - '

      '
    strategy: recursive
data:
  base_path: ../data/final_data
  discussion: discussions.json
  docs: docs.json
  request_file: ../requests/final_request.json
  src_data: ../src/pytorch-lightning/src/lightning/pytorch
embeddings:
  batch_size: 32
  device: auto
  embedding_dim: 768
  fallback_models:
  - microsoft/codebert-base
  - sentence-transformers/all-mpnet-base-v2
  long_context_model: bigcode/starcoder2-3b
  max_tokens: 512
  primary_model: microsoft/unixcoder-base
evaluation:
  k_values:
  - 1
  - 3
  - 5
  - 10
  metrics:
  - recall@k
  - mrr
  - ndcg
  - hit_rate
llm:
  max_tokens: 1024
  model: gpt-3.5-turbo
  temperature: 0.1
retrieval:
  hybrid:
    dense_weight: 0.7
    sparse_weight: 0.3
  repocoder:
    draft_generation: true
    enabled: true
    max_iterations: 2
  rerank:
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_n: 5
  top_k: 10
storage:
  graph_db:
    backend: networkx
    neo4j:
      password: password
      uri: bolt://localhost:7687
      user: neo4j
    relations:
    - BELONGS_TO
    - CALLS
    - IMPORTS
    - INHERITS
  vector_store:
    backend: qdrant
    collection_name: pytorch_lightning_rag
    host: localhost
    multi_vector: true
    port: 6333
    vector_types:
    - code
    - documentation
    - discussion
