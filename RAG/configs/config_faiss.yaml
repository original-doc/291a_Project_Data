# PyTorch Lightning RAG System Configuration (FAISS backend)

# Data Paths (relative to project root)
data:
  base_path: "../data/final_data"
  # src_data: "src_filtered_data.json"
  src_data: "../src/pytorch-lightning/src/lightning/pytorch"
  docs: "docs.json"
  discussion: "discussions.json"
  request_file: "../../requests/new_requests.json"

# Embedding Configuration
embeddings:
  primary_model: "microsoft/unixcoder-base"
  fallback_models:
    - "microsoft/codebert-base"
    - "sentence-transformers/all-mpnet-base-v2"
  long_context_model: "bigcode/starcoder2-3b"
  embedding_dim: 768
  max_tokens: 512
  device: "auto"
  batch_size: 32

# Chunking Configuration
chunking:
  code:
    strategy: "ast_functional"
    include_docstrings: true
    include_class_context: true
    max_chunk_size: 1024
  docs:
    strategy: "recursive"
    chunk_size: 512
    chunk_overlap: 50
    separators:
      - "\n## "
      - "\n### "
      - "\n--- "
      - "\n.. code::"
      - "\n\n"
      - "\n"
  discussion:
    strategy: "paired"
    include_metadata: true

# Storage Configuration
storage:
  vector_store:
    backend: "faiss"           # Use FAISS for local/offline indexing
    collection_name: "pytorch_lightning_rag"
    index_type: "IVFFlat"      # Options: IVFFlat, Flat
    nlist: 100                 # Number of Voronoi cells for IVF
    multi_vector: true
    vector_types:
      - "code"
      - "documentation"
      - "discussion"
  graph_db:
    backend: "networkx"        # Options: networkx, neo4j
    neo4j:
      uri: "bolt://localhost:7687"
      user: "neo4j"
      password: "password"
    relations:
      - "BELONGS_TO"
      - "CALLS"
      - "IMPORTS"
      - "INHERITS"

# Retrieval Configuration
retrieval:
  hybrid:
    dense_weight: 0.7
    sparse_weight: 0.3
  top_k: 10
  rerank:
    enabled: true
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_n: 5
  repocoder:
    enabled: true
    max_iterations: 2
    draft_generation: true

# LLM Configuration
llm:
  model: "gpt-3.5-turbo"
  temperature: 0.1
  max_tokens: 1024

# Evaluation Configuration
evaluation:
  metrics:
    - "recall@k"
    - "precision@k"
    - "mrr"
    - "ndcg"
  k_values: [1, 3, 5, 10]

